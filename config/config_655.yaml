# Game definition for Vietlott Power 6/55: 6 numbers drawn without
# replacement from a pool of 55 (1..55).
game:
  name: "Vietlott Power 6/55"
  pool_size: 55
  draw_size: 6
  ticket_price_vnd: 10000

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  draws_file: "draws_655.csv"

scraper:
  base_url: "https://api.vietlott.vn/v5/desktop/vi/issearch/index/power655"
  page_size: 50
  max_pages: 20
  timeout_s: 15
  max_retries: 3
  retry_backoff_s: 2.0

analysis:
  monte_carlo_sims: 20000
  significance_level: 0.05
  random_seed: 42
  split_half_drift_test: true

modeling:
  history_window: 20
  test_fraction: 0.2
